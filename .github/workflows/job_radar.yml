name: Daily Industry 4.0 Job Radar

on:
  schedule:
    - cron: "30 6 * * *" # Runs daily at 06:30 UTC (07:30 CET winter / 08:30 CEST summer)
  workflow_dispatch:     # Adds a manual "Run workflow" button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_radar.py

      - name: Commit updated state & UI feed
        run: |
          git config user.name "job-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_jobs.json matched_jobs.csv docs/jobs.json || true
          git diff --staged --quiet || git commit -m "chore: update job radar feed"
          git push
