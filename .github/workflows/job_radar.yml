name: Daily Industry 4.0 Job Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python job_radar.py
      - run: |
          git config user.name "job-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_jobs.json matched_jobs.csv docs/jobs.json || true
          git diff --staged --quiet || git commit -m "chore: update job radar feed"
          git push
